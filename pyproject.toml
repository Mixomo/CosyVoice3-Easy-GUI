[project]
name = "cosyvoice3-easy-gui"
version = "0.1.0"
description = "Reproducible Windows Easy GUI for Fun-CosyVoice3"
requires-python = "==3.11.*"
dependencies = [
  "conformer==0.3.2",
  "ctranslate2==4.8.1",
  "diffusers==0.29.0",
  "faster-whisper==1.2.1",
  "gradio==5.45.0",
  "gdown==5.2.0",
  "huggingface-hub==0.36.0",
  "hf-xet==1.6.0",
  "HyperPyYAML==1.2.3",
  "hydra-core==1.3.2",
  "inflect==7.3.1",
  "num2words==0.5.14",
  "librosa==0.10.2.post1",
  "lightning==2.3.3",
  "modelscope==1.20.0",
  "matplotlib==3.9.4",
  "networkx==3.1",
  "numpy==1.26.4",
  "omegaconf==2.3.0",
  "onnx==1.16.0",
  "onnxruntime-gpu==1.26.0",
  "openai-whisper==20231117",
  "peft==0.15.2",
  "pyarrow==18.1.0",
  "pydantic==2.7.0",
  "pydub==0.25.1",
  "pyworld==0.3.4",
  "rich==13.7.1",
  "safetensors==0.5.2",
  "setuptools==80.9.0",
  "soundfile==0.12.1",
  "tensorboard==2.20.0",
  "torch==2.8.0+cu128; sys_platform == 'win32' and platform_machine == 'AMD64'",
  "torchaudio==2.8.0+cu128; sys_platform == 'win32' and platform_machine == 'AMD64'",
  "triton-windows==3.4.0.post21; sys_platform == 'win32' and platform_machine == 'AMD64'",
  "onnxruntime==1.26.0; sys_platform == 'win32' and platform_machine == 'AMD64'",
  "torchmetrics==1.4.3",
  "transformers==4.51.3",
  "wetext==0.0.4",
  "wget==3.2",
  "x-transformers==2.11.24",
]

[project.optional-dependencies]
test = ["pytest==9.0.2"]

[tool.uv]
package = false
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]
required-environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[tool.uv.extra-build-dependencies]
openai-whisper = ["setuptools==80.9.0"]

[tool.uv.sources]
torch = [{ index = "pytorch-cuda", marker = "sys_platform == 'win32' and platform_machine == 'AMD64'" }]
torchaudio = [{ index = "pytorch-cuda", marker = "sys_platform == 'win32' and platform_machine == 'AMD64'" }]
onnxruntime = { path = "vendor/onnxruntime-gpu-shim" }

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires an NVIDIA GPU and downloaded model"]
